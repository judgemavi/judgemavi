<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" fill="none" stroke="#191919" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
  <title>A practice of people and systems</title>
  <desc>People and software layers balance on a shared pivot. Below, a repaired path represents project rescue, while a magnifying glass reveals a circuit’s internal connections for reverse engineering.</desc>
  <view id="balance" viewBox="0 112 560 234"/>
  <view id="investigation" viewBox="0 425 560 170"/>
  <g transform="translate(0 50)">
  <!-- Construction marks and one continuous connection, not four separate cards. -->
  <g stroke-opacity=".23" stroke-dasharray="3 6">
    <path d="M280 84v428M20 225h520M124 94v136M440 94v136M20 488h520"/>
    <ellipse cx="280" cy="262" rx="60" ry="12"/>
    <path d="M124 269v88M440 269v88"/>
  </g>
  <!-- Servant leadership: a shared platform supporting the whole group. -->
  <ellipse cx="123" cy="207" rx="89" ry="17" fill="#e4ff00"/>
  <circle cx="124" cy="121" r="18" fill="#ededeb"/>
  <path d="M96 196v-25q0-29 28-29t28 29v25" fill="#ededeb"/>
  <circle cx="70" cy="155" r="14" fill="#ff2bd6"/>
  <path d="M48 206v-23q0-14 22-14t22 14v23" fill="#ededeb"/>
  <circle cx="178" cy="155" r="14" fill="#e4ff00"/>
  <path d="M156 206v-23q0-14 22-14t22 14v23" fill="#ededeb"/>
  <path d="M114 170h20m-10-10v20M60 195h20m88 0h20"/>
  <!-- Hands-on engineering: the layers, and the code within them. -->
  <path d="m354 181 84-33 88 33-84 35z" fill="#ededeb"/>
  <path d="m354 146 84-33 88 33-84 35z" fill="#ff2bd6"/>
  <path d="m354 111 84-33 88 33-84 35z" fill="#e4ff00"/>
  <path d="m407 102-17 10 18 7m64-18 17 10-17 8m-37-18 8 22M389 184l52-21 46 18"/>
  <path d="M354 111v70m172-70v70m-84-35v70" stroke-dasharray="3 5" stroke-opacity=".5"/>
  <!-- Equal weight, shared fulcrum. -->
  <path d="M36 225h488l-8 7H44z" fill="#191919"/>
  <path d="m280 235-20 30h40z" fill="#ff2bd6"/>
  <circle cx="280" cy="228" r="6" fill="#e4ff00"/>
  <g stroke-width="1.2">
    <path d="M16 264c60-37 103 33 168 0s117 33 183 0 111 33 177 0"/>
    <path d="M16 271c60-37 103 33 168 0s117 33 183 0 111 33 177 0"/>
  </g>
  </g>
  <g transform="translate(0 80)">
  <!-- Project rescue: reconnect the broken route with a new structural span. -->
  <path d="M25 449h67m76 0h66M25 459h67m76 0h66" stroke-width="2.5"/>
  <path d="m91 444 7 8-7 7m77-15-7 8 7 7"/>
  <path d="M73 441v-43h113v43M73 407h113M73 441l38-34 37 34 38-34" stroke-width="2"/>
  <path d="M82 435h95v12H82z" fill="#ff2bd6"/>
  <path d="M73 448v40m113-40v40M58 488h30m83 0h30"/>
  <path d="M34 421h20m-7-6 7 6-7 6m147 24h28m-7-6 7 6-7 6"/>
  <circle cx="129" cy="383" r="9" fill="#e4ff00"/>
  <path d="m125 383 3 3 5-6"/>
  <!-- Reverse engineering: inspect an existing system and trace its hidden logic. -->
  <rect x="330" y="375" width="154" height="104" rx="4" fill="#ededeb"/>
  <path d="M342 395h26v18h21m-47 29h18v-13h29m-47 34h44v-18h19M398 386v17m0 36v27h29"/>
  <rect x="389" y="405" width="18" height="30" fill="#e4ff00"/>
  <path d="M393 412h10m-10 8h10m-10 8h10" stroke-width="1.2"/>
  <circle cx="342" cy="395" r="3" fill="#ededeb"/>
  <circle cx="342" cy="442" r="3" fill="#ff2bd6"/>
  <circle cx="342" cy="463" r="3" fill="#ededeb"/>
  <path d="M407 420h16" stroke="#ff2bd6" stroke-width="3"/>
  <!-- A larger lens makes investigation, rather than another stack, the focal point. -->
  <path d="m486 447 38 38" stroke-width="13"/>
  <path d="m486 447 38 38" stroke="#ff2bd6" stroke-width="8"/>
  <circle cx="455" cy="414" r="44" fill="#ededeb" stroke-width="2.5"/>
  <path d="M422 394a38 38 0 0 1 51-14" stroke-opacity=".4"/>
  <rect x="442" y="400" width="26" height="28" fill="#e4ff00"/>
  <path d="M449 393v7m12-7v7m-12 28v8m12-8v8m-26-27h7m-7 11h7m26-11h8m-8 11h8"/>
  <path d="M419 419h12v-10h11m13 19v16h22" stroke="#ff2bd6" stroke-width="2.5"/>
  <path d="M468 409h17v-13m-54 31v13m18-32h12v12h-12z"/>
  <circle cx="477" cy="444" r="3" fill="#ff2bd6"/>
  <circle cx="485" cy="396" r="3" fill="#ededeb"/>
  <circle cx="431" cy="440" r="3" fill="#ededeb"/>
  <path d="M12 501v8h8m520 0h8v-8" stroke-opacity=".5"/>
  </g>
</svg>
